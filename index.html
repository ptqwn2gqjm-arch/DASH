<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:description" content="韓迷在買什麼？Dash 每週告訴你。美妝、周邊、潮牌，一站看懂韓國選物。">

<title>Dash — 韓迷在買什麼？每週告訴你</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --blue: #0F4C81; --blue-light: #1a6bb5; --bg: #fff; --text: #111; --muted: #888; --border: #e8e8e8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }

  .panel { position: fixed; left: 0; right: 0; height: 50vh; background: var(--blue); z-index: 1000; overflow: hidden; }
  #pt { top: 0; }
  #pb { top: 50vh; }
  .logo { position: absolute; left: 0; right: 0; display: flex; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(72px, 18vw, 160px); line-height: 1; letter-spacing: 0.06em; color: white; white-space: nowrap; }
  #logo-top { bottom: 0; align-items: flex-end; transform: translateY(50%); }
  #logo-bot { top: 0; align-items: flex-start; transform: translateY(-50%); }
  .da, .sh { display: inline-block; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px;
    display: flex; align-items: center; gap: 16px;
    opacity: 0; transition: opacity 0.4s ease;
  }
  nav.visible { opacity: 1; }
  .nav-logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.08em; text-decoration: none; flex-shrink: 0; }
  .nav-logo .da { color: var(--blue); }
  .nav-logo .sh { color: var(--text); }
  .nav-search { flex: 1; max-width: 360px; position: relative; display: flex; align-items: center; margin: 0 auto; }
  .nav-search input { width: 100%; padding: 8px 16px 8px 38px; border: 1.5px solid var(--border); border-radius: 20px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; outline: none; transition: all 0.3s; background: #f5f7fa; color: var(--text); }
  .nav-search input:focus { border-color: var(--blue); background: white; box-shadow: 0 0 0 3px rgba(15,76,129,0.08); }
  .nav-search .search-icon { position: absolute; left: 13px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; transition: color 0.2s; }
  .nav-search:focus-within .search-icon { color: var(--blue); }
  .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; flex-shrink: 0; }
  .nav-links a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; text-decoration: none; color: var(--muted); border-radius: 8px; transition: all 0.2s; font-size: 10px; letter-spacing: 0.05em; }
  .nav-links a:hover { background: #f0f5ff; color: var(--blue); }
  .nav-links a svg { width: 18px; height: 18px; stroke-width: 1.8; }
  .nav-login { background: var(--blue) !important; color: white !important; }
  .nav-login:hover { background: var(--blue-light) !important; }

  @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
  @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
  @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(2.2); opacity: 0; } }

  .hero-badge, .hero-title, .hero-sub, .hero-stats, .hero-cta, .hero-floats { opacity: 0; }

  .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: #f0f5ff; border: 1px solid #c8d8f0; border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--blue); font-weight: 500; margin-bottom: 20px; align-self: flex-start; }
  .hero-badge .dot { width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; position: relative; flex-shrink: 0; }
  .hero-badge .dot::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid #2ecc71; animation: pulse-ring 1.5s ease-out infinite; }

  .hero-stats { display: flex; gap: 40px; margin-bottom: 44px; }
  .stat-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; color: var(--blue); line-height: 1; letter-spacing: 0.02em; }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }

  .hero-title .shimmer { background: linear-gradient(90deg, var(--blue) 0%, #4a90d9 40%, var(--blue) 60%, #0a3560 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear 2s infinite; }

  .hero-floats { position: absolute; right: 5%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; pointer-events: none; }
  .float-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(15,76,129,0.08); width: 240px; }
  .float-card-icon { width: 40px; height: 40px; border-radius: 8px; background: #f0f5ff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .float-card-text { flex: 1; }
  .float-card-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .float-card-sub { font-size: 11px; color: var(--muted); }

  @media (max-width: 900px) { .hero-floats { display: none; } .hero-stats { gap: 24px; } }

  .hero { min-height: 100vh; padding: 120px 60px 80px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 60% at 80% 40%, rgba(15,76,129,0.06) 0%, transparent 70%); pointer-events: none; }
  .hero-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(64px, 10vw, 120px); line-height: 0.95; letter-spacing: 0.02em; margin-bottom: 28px; }
  .hero-title .outline { color: transparent; -webkit-text-stroke: 2px var(--blue); }
  .hero-sub { font-size: 18px; color: var(--muted); line-height: 1.7; max-width: 480px; margin-bottom: 44px; font-weight: 300; }
  .hero-cta { display: inline-flex; align-items: center; gap: 10px; background: var(--blue); color: white; padding: 14px 32px; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; text-decoration: none; transition: all 0.2s; align-self: flex-start; }
  .hero-cta:hover { background: var(--blue-light); transform: translateY(-2px); }
  .hero-cta svg { width: 18px; height: 18px; }
  .hero-scroll { position: absolute; bottom: 40px; left: 40px; display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }
  .scroll-line { width: 40px; height: 1px; background: var(--border); }

  .section { padding: 80px 40px; opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .section.visible { opacity: 1; transform: translateY(0); }
  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 40px; }
  .section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 48px; letter-spacing: 0.04em; }
  .section-title span { color: var(--blue); }
  .section-link { font-size: 12px; letter-spacing: 0.1em; color: var(--blue); text-decoration: none; text-transform: uppercase; font-weight: 500; border-bottom: 1px solid var(--blue); padding-bottom: 2px; transition: opacity 0.2s; }
  .section-link:hover { opacity: 0.6; }

  .picks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
  .pick-card { border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; transition: all 0.25s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
  .pick-card:hover { border-color: var(--blue); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(15,76,129,0.1); }
  .pick-img { aspect-ratio: 4/3; background: #f0f4f8; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif; overflow: hidden; flex-shrink: 0; }
  .pick-img img { width: 100%; height: 100%; object-fit: cover; }
  .pick-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
  .pick-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pick-platform { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: white; background: var(--blue); padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .pick-date { font-size: 11px; color: var(--muted); }
  .pick-name { font-size: 15px; font-weight: 500; line-height: 1.5; margin-bottom: 10px; }
  .pick-desc { font-size: 13px; color: var(--muted); line-height: 1.7; font-weight: 300; margin-bottom: 16px; flex: 1; }
  .pick-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--blue); letter-spacing: 0.08em; font-weight: 500; text-transform: uppercase; margin-top: auto; }
  .pick-link svg { width: 14px; height: 14px; }

  .about-strip { background: var(--blue); padding: 60px 40px; display: flex; align-items: center; justify-content: space-between; gap: 40px; opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .about-strip.visible { opacity: 1; transform: translateY(0); }
  .about-strip h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; color: white; letter-spacing: 0.04em; line-height: 1.1; }
  .about-strip p { color: rgba(255,255,255,0.65); font-size: 15px; margin-top: 8px; font-weight: 300; }
  .about-strip a { display: inline-flex; align-items: center; gap: 8px; background: white; color: var(--blue); padding: 12px 24px; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-decoration: none; transition: all 0.2s; flex-shrink: 0; }
  .about-strip a:hover { transform: translateY(-2px); opacity: 0.9; }

  footer { padding: 32px 40px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .footer-logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.08em; }
  .footer-logo .da { color: var(--blue); }
  .footer-logo .sh { color: var(--text); }
  .footer-copy { font-size: 12px; color: var(--muted); }

  @media (max-width: 768px) {
    nav { padding: 0 16px; gap: 8px; }
    .nav-search { max-width: 180px; }
    .hero { padding: 100px 20px 60px; }
    .section, .about-section { padding: 60px 20px; }
    .about-strip { flex-direction: column; padding: 48px 20px; }
    footer { padding: 24px 20px; flex-direction: column; gap: 12px; text-align: center; }
  }
</style>
</head>
<body>

<div class="panel" id="pt">
  <div class="logo" id="logo-top"><span class="da" id="da-t">DA</span><span class="sh" id="sh-t">SH</span></div>
</div>
<div class="panel" id="pb">
  <div class="logo" id="logo-bot"><span class="da" id="da-b">DA</span><span class="sh" id="sh-b">SH</span></div>
</div>

<nav id="nav">
  <a href="index.html" class="nav-logo"><span class="da">DA</span><span class="sh">SH</span></a>
  <div class="nav-search">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="搜尋文章⋯" id="nav-search-input"
      onkeydown="if(event.key==='Enter'&&this.value.trim())window.location.href='picks.html?q='+encodeURIComponent(this.value.trim())">
  </div>
  <ul class="nav-links">
    <li><a href="picks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>選物</a></li>
    <li><a href="about.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>關於</a></li>
    <li><a href="login.html" class="nav-login"><svg viewBox="0 0 24 24" fill="none" stroke="white"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>登入</a></li>
  </ul>
</nav>

<section class="hero" id="hero">
  <div class="hero-bg"></div>
  <div class="hero-badge"><div class="dot"></div>每週更新選物中</div>
  <h1 class="hero-title"><span class="shimmer">韓迷在買什麼？</span><br>Dash 每週<br><span class="outline">告訴你。</span></h1>
  <p class="hero-sub">美妝、周邊、潮牌，一站看懂韓國選物。</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num" id="stat-count">0</div><div class="stat-label">篇精選文章</div></div>
    <div class="stat"><div class="stat-num" id="stat-platform">3+</div><div class="stat-label">合作平台</div></div>
    <div class="stat"><div class="stat-num">免費</div><div class="stat-label">完全免費閱讀</div></div>
  </div>
  <a href="picks.html" class="hero-cta">看本週選物 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
  <div class="hero-scroll"><div class="scroll-line"></div>向下捲動</div>
  <div class="hero-floats" id="hero-floats"></div>
</section>

<section class="section" id="picks">
  <div class="section-header">
    <h2 class="section-title">本週<span>選物</span></h2>
    <a href="picks.html" class="section-link">查看全部</a>
  </div>
  <div class="picks-grid" id="picks-grid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:#888;font-size:14px">載入中⋯</div>
  </div>
</section>

<div class="about-strip" id="about-strip">
  <div>
    <h2>不用飛首爾</h2>
    <p>也能知道韓國現在最夯什麼。</p>
  </div>
  <a href="about.html">了解更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
</div>

<footer>
  <div class="footer-logo"><span class="da">DA</span><span class="sh">SH</span></div>
  <div class="footer-copy">© 2026 Dash. 韓迷做給韓迷的選物平台。</div>
</footer>

<script>
(function () {
  const pt = document.getElementById('pt');
  const pb = document.getElementById('pb');
  const daEls = [document.getElementById('da-t'), document.getElementById('da-b')];
  const shEls = [document.getElementById('sh-t'), document.getElementById('sh-b')];
  const all = [...daEls, ...shEls];

  function revealPage() {
    if (pt) { pt.style.transition = 'none'; pt.style.display = 'none'; }
    if (pb) { pb.style.transition = 'none'; pb.style.display = 'none'; }
    const nav = document.getElementById('nav');
    if (nav) nav.style.opacity = '1';
    const heroEl = document.getElementById('hero');
    if (heroEl) heroEl.style.opacity = '1';
    document.body.style.overflow = '';
    document.body.style.height = '';

    const items = [
      { sel: '.hero-badge',  delay: 0   },
      { sel: '.hero-title',  delay: 100 },
      { sel: '.hero-sub',    delay: 200 },
      { sel: '.hero-stats',  delay: 300 },
      { sel: '.hero-cta',    delay: 400 },
      { sel: '.hero-floats', delay: 500 },
    ];
    items.forEach(({ sel, delay }) => {
      const el = document.querySelector(sel);
      if (!el) return;
      setTimeout(() => {
        el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        el.style.opacity = '1';
        el.style.transform = 'translateY(0) translateX(0)';
      }, delay);
    });

    setTimeout(() => {
      document.querySelectorAll('.float-card').forEach((c, i) => {
        c.style.animation = `floatY 4s ease-in-out ${0.8 + i * 0.6}s infinite`;
      });
    }, 800);

    setTimeout(() => {
      const shimmer = document.querySelector('.hero-title .shimmer');
      if (shimmer) shimmer.style.animation = 'shimmer 3s linear infinite';
    }, 600);

    setTimeout(() => {
      document.querySelectorAll('.section, .about-strip').forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight + 100) el.classList.add('visible');
      });
    }, 200);

    loadFloatCards();
    renderPicks();
    animateCounts();
    setupScrollReveal();
    setupParallax();
  }

  const visited = sessionStorage.getItem('dash_visited');
  if (visited) {
    revealPage();
  } else {
    sessionStorage.setItem('dash_visited', '1');
    document.body.style.overflow = 'hidden';

    daEls.forEach(el => { el.style.transform = 'translateX(-120vw)'; });
    shEls.forEach(el => { el.style.transform = 'translateX(120vw)'; });

    setTimeout(() => {
      daEls.forEach(el => { el.style.transition = 'transform 580ms cubic-bezier(0.22,1,0.36,1)'; el.style.transform = 'translateX(0)'; });
      shEls.forEach(el => { el.style.transition = 'transform 580ms cubic-bezier(0.22,1,0.36,1)'; el.style.transform = 'translateX(0)'; });
    }, 200);

    setTimeout(() => {
      const frames = [0, -10, 10, -7, 7, -4, 4, -2, 2, 0];
      let i = 0;
      const tick = setInterval(() => {
        all.forEach(el => { el.style.transition = 'none'; el.style.transform = `translateX(${frames[i]}px)`; });
        i++;
        if (i >= frames.length) { clearInterval(tick); all.forEach(el => { el.style.transform = 'translateX(0)'; }); }
      }, 40);
    }, 930);

    setTimeout(() => {
      pt.style.transition = 'transform 520ms cubic-bezier(0.76,0,0.24,1)';
      pt.style.transform = 'translateY(-100%)';
      pb.style.transition = 'transform 520ms cubic-bezier(0.76,0,0.24,1)';
      pb.style.transform = 'translateY(100%)';
    }, 1300);

    setTimeout(revealPage, 1920);
  }

  function loadFloatCards() {
    const about = JSON.parse(localStorage.getItem('dash_about') || '{}');
    const defaults = [
      { emoji: '💿', title: 'Weverse Shop', sub: '專輯 · 周邊 · 限定版' },
      { emoji: '🌿', title: 'Olive Young',  sub: '韓系美妝 · 保養' },
      { emoji: '👕', title: 'Musinsa',      sub: '設計師品牌 · 潮流' },
    ];
    const cards = about.floatCards || defaults;
    const el = document.getElementById('hero-floats');
    if (!el) return;
    const offsets = ['32px', '0', '16px'];
    el.innerHTML = cards.map((c, i) => `
      <div class="float-card" style="margin-left:${offsets[i] || '0'}">
        <div class="float-card-icon">${c.emoji}</div>
        <div class="float-card-text">
          <div class="float-card-title">${c.title}</div>
          <div class="float-card-sub">${c.sub}</div>
        </div>
      </div>`).join('');
    if (about.bgFrom || about.bgTo) {
      const hero = document.getElementById('hero');
      if (hero) hero.style.background = `linear-gradient(135deg, ${about.bgFrom || '#eef3fa'} 0%, ${about.bgTo || '#ffffff'} 100%)`;
    }
  }

  function renderPicks() {
    const grid = document.getElementById('picks-grid');
    if (!grid) return;
    try {
      const articles = JSON.parse(localStorage.getItem('dash_articles') || '[]');
      const pinned = articles.filter(a => a.pinned);
      const rest = articles.filter(a => !a.pinned);
      const picks = [...pinned, ...rest].slice(0, 4);
      if (!picks.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888;font-size:14px">還沒有文章，請先到後台新增。</div>';
        return;
      }
      grid.innerHTML = picks.map(a => `
        <a class="pick-card" href="article.html?id=${a.id}">
          <div class="pick-img">${a.cover ? `<img src="${a.cover}" alt="${a.title}" style="width:100%;height:100%;object-fit:cover">` : '商品圖片'}</div>
          <div class="pick-body">
            <div class="pick-meta"><span class="pick-platform">${a.platform}</span><span class="pick-date">${(a.date||'').slice(5)}</span></div>
            <div class="pick-name">${a.title}</div>
            <div class="pick-desc">${a.desc}</div>
            <div class="pick-link">${a.linkLabel||'閱讀更多'} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
          </div>
        </a>`).join('');
    } catch { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888">無法載入文章。</div>'; }
  }

  function animateCounts() {
    function count(id, target, suffix) {
      const el = document.getElementById(id); if (!el) return;
      let n = 0; const step = Math.max(1, Math.ceil(target / 20));
      const t = setInterval(() => { n = Math.min(n + step, target); el.textContent = n + suffix; if (n >= target) clearInterval(t); }, 60);
    }
    const articles  = JSON.parse(localStorage.getItem('dash_articles') || '[]');
    const platforms = JSON.parse(localStorage.getItem('dash_platforms') || '[]');
    count('stat-count',    articles.length  || 4, '+');
    count('stat-platform', platforms.length || 3, '+');
  }

  function setupScrollReveal() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0 });
    document.querySelectorAll('.section, .about-strip').forEach(el => obs.observe(el));
  }

  function setupParallax() {
    const floats = document.querySelector('.hero-floats');
    const bg     = document.querySelector('.hero-bg');
    let ticking  = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        if (floats) floats.style.transform = `translateY(calc(-50% - ${y * 0.2}px))`;
        if (bg)     bg.style.transform     = `translateY(${y * 0.08}px)`;
        ticking = false;
      });
      ticking = true;
    });
  }

})();
</script>
